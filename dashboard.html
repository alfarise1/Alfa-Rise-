<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Alfa Rise</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f4ee;color:#14231f;margin:0;padding:24px}
.box{max-width:560px;margin:30px auto;background:#fff;padding:24px;border:1px solid #d8d2c4;border-radius:6px}
h1{font-size:22px;margin:0 0 8px;color:#0a332f}
h2{font-size:18px;margin:22px 0 8px;color:#0a332f}
p{margin:6px 0 16px;font-size:15px}
a.btn,button{display:block;width:100%;padding:12px;border:0;border-radius:4px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;box-sizing:border-box;margin-top:10px}
.p{background:#0f4c46;color:#fff}.s{background:#c98a3e;color:#0a332f}
.card{border:1px solid #d8d2c4;border-radius:6px;padding:12px;margin:10px 0;font-size:14px;word-break:break-word}
.card b{color:#0a332f;font-size:15px}
.card a{color:#0f4c46}
.meta{color:#56605d;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div class="box" id="box" style="display:none">
<h1>Welcome to Alfa Rise</h1>
<p id="who"></p>
<div id="admin" style="display:none">
<h2>Inquiries (<span id="count">0</span>)</h2>
<button class="p" id="refresh">Refresh</button>
<div id="list"></div>
</div>
<a class="btn p" href="index.html">Go to website</a>
<button class="s" id="logout">Logout</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
var sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
var $ = function(id){return document.getElementById(id)};
var ADMIN = 'alfarisestore@gmail.com';
async function loadInquiries(){
  var list = $('list');
  var r = await sb.from('inquiries').select('*').order('created_at',{ascending:false});
  list.textContent = '';
  if(r.error){list.textContent='Could not load inquiries.';return}
  $('count').textContent = r.data.length;
  if(!r.data.length){list.textContent='No inquiries yet.';return}
  r.data.forEach(function(q){
    var c = document.createElement('div'); c.className = 'card';
    var n = document.createElement('b'); n.textContent = q.name; c.appendChild(n);
    var p = document.createElement('div');
    var a = document.createElement('a'); a.textContent = q.phone;
    a.href = 'tel:' + String(q.phone).replace(/[^0-9+]/g,'');
    p.appendChild(a); c.appendChild(p);
    var sv = document.createElement('div'); sv.textContent = 'Service: ' + (q.service || '-'); c.appendChild(sv);
    if(q.message){var m = document.createElement('div'); m.textContent = q.message; c.appendChild(m)}
    var d = document.createElement('div'); d.className = 'meta'; d.textContent = new Date(q.created_at).toLocaleString(); c.appendChild(d);
    list.appendChild(c);
  });
}
sb.auth.getSession().then(function(r){
  var s = r.data.session;
  if(!s){ window.location.replace('login.html'); return; }
  $('who').textContent = 'Logged in as ' + s.user.email;
  $('box').style.display = 'block';
  if(s.user.email && s.user.email.toLowerCase() === ADMIN){
    $('admin').style.display = 'block';
    loadInquiries();
  }
});
$('refresh').onclick = loadInquiries;
$('logout').onclick = async function(){
  await sb.auth.signOut();
  window.location.replace('login.html');
};
</script>
</body>
</html>
