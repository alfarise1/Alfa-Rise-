<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Alfa Rise</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f4ee;color:#14231f;margin:0;padding:24px}
.box{max-width:420px;margin:30px auto;background:#fff;padding:24px;border:1px solid #d8d2c4;border-radius:6px}
h1{font-size:22px;margin:0 0 6px;color:#0a332f}
p.sub{margin:0 0 18px;font-size:14px;color:#56605d}
label{font-size:14px;font-weight:600}
input,select,textarea{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #d8d2c4;border-radius:4px;font-size:16px;box-sizing:border-box;font-family:Arial,sans-serif;background:#fff}
textarea{min-height:100px;resize:vertical}
button{width:100%;padding:13px;border:0;border-radius:4px;font-size:16px;font-weight:600;cursor:pointer;background:#c98a3e;color:#0a332f}
button:disabled{opacity:.6}
a{color:#0f4c46;font-size:14px}
#msg{margin-top:14px;font-size:14px;min-height:20px}
.err{color:#b00020}.ok{color:#0f4c46}
</style>
</head>
<body>
<div class="box">
<h1>Tell us about your project</h1>
<p class="sub">We usually reply within a few hours.</p>
<form id="f">
<label for="name">Your name</label>
<input id="name" type="text" maxlength="100" autocomplete="name" required>
<label for="phone">Phone / WhatsApp number</label>
<input id="phone" type="tel" maxlength="20" autocomplete="tel" required>
<label for="service">What do you need?</label>
<select id="service">
<option>Web Design</option>
<option>AI Chatbot</option>
<option>Automation</option>
<option>Branding</option>
<option>Other</option>
</select>
<label for="message">Message (optional)</label>
<textarea id="message" maxlength="1000"></textarea>
<button type="submit" id="go">Send inquiry</button>
</form>
<div id="msg"></div>
<p><a href="index.html">Back to website</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
var sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
var $ = function(id){return document.getElementById(id)};
function say(t, ok){var m=$('msg');m.textContent=t;m.className=ok?'ok':'err'}
$('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var name=$('name').value.trim();
  var phone=$('phone').value.trim();
  if(name.length<2){say('Please enter your name.',false);return}
  if(phone.length<7){say('Please enter a valid phone number.',false);return}
  $('go').disabled=true;
  var r=await sb.from('inquiries').insert({name:name,phone:phone,service:$('service').value,message:$('message').value.trim()});
  $('go').disabled=false;
  if(r.error){say('Could not send. Please try again or WhatsApp us.',false)}
  else{try{fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({access_key:'1177864a-dfe3-4f0f-b894-113c5a4411b3',subject:'New Alfa Rise inquiry',from_name:'Alfa Rise Website',name:name,phone:phone,service:$('service').value,message:$('message').value.trim()})}).catch(function(){})}catch(e){} say('Thank you! We received your inquiry and will contact you soon.',true);$('f').reset()}
</script>
</body>
</html>
