<!index html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfa Rise - Professional Web Services</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f4f6f9 0%, #e9edf2 100%);
            color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            font-size: clamp(32px, 6vw, 45px);
            color: #1a2b4c;
            margin-bottom: 8px;
        }

        h2 {
            font-size: clamp(18px, 3vw, 22px);
            color: #4a6fa5;
            font-weight: 500;
            margin-bottom: 20px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
        }

        button, .btn {
            padding: 14px 28px;
            font-size: 17px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            width: 100%;
            max-width: 280px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button:hover, .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .primary {
            background: #25d366;
            color: white;
        }

        .secondary {
            background: #1a2b4c;
            color: white;
        }

        footer {
            margin-top: 24px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Alfa Rise</h1>
        <h2>Professional Web Services</h2>
        <p>We build modern, simple and professional websites for small businesses and entrepreneurs.</p>

        <div class="buttons">
            <!-- Replace 923XXXXXXXXX with your real WhatsApp number, country code included -->
            <a class="btn primary" href="https://wa.me/923067010978?text=Hi%2C%20I%27m%20interested%20in%20your%20web%20services" target="_blank">
                WhatsApp Us
            </a>

            <a class="btn secondary" href="mailto:alfarisestore@gmail.com?subject=Website%20Inquiry">
                Email Us
            </a>
        </div>

        <footer>&copy; 2026 Alfa Rise. All rights reserved.</footer>
    </div>

</body>
</html>
